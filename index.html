<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTrade</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="img/logo.webp" alt="Логотип" class="logo">
        </a>
        <nav>
            <ul class="menu-container">
                <li><a href="index.html">Главная</a></li>
                <li><a href="inventory.html">Автомобили в наличии</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="login.html">Войти</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="banner">
            <img src="img/banner.webp" alt="Баннер">
        </section>
        <section class="products-container">
            <div class="product">
                <img src="img/octavia.jpg" alt="Skoda Octavia">
                <div class="info-products">
                    <h3>Skoda Octavia</h3>
                    <div class="price">Цена: 2 900 ₽/сутки</div>
                    <div>
                        <button class="buy-button">Арендовать</button>
                    </div>
                </div>
            </div>
            <div class="product">
                <img src="img/jetta.jpeg" alt="Volkswagen Jetta">
                <div class="info-products">
                    <h3>Volkswagen Jetta</h3>
                    <div class="price">Цена: 3 500 ₽/сутки</div>
                    <div>
                        <button class="buy-button">Арендовать</button>
                    </div>
                </div>
            </div>
            <div class="product">
                <img src="img/corolla.jpg" alt="Toyota Corolla">
                <div class="info-products">
                    <h3>Toyota Corolla</h3>
                    <div class="price">Цена: 4 200 ₽/сутки</div>
                    <div>
                        <button class="buy-button">Арендовать</button>
                    </div>
                </div>
            </div>
            <div class="product">
                <img src="img/camry.jpg" alt="Toyota Camry">
                <div class="info-products">
                    <h3>Toyota Camry</h3>
                    <div class="price">Цена: 4 900 ₽/сутки</div>
                    <div>
                        <button class="buy-button">Арендовать</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 RentAuto. Все права защищены.</p>
    </footer>
</body>

</html>
